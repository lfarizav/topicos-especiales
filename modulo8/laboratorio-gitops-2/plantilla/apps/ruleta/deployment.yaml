apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruleta
  namespace: ruleta
  labels: {app: ruleta}
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: ruleta}
  template:
    metadata:
      labels: {app: ruleta}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ruleta
          image: gitops2-registry:5000/ruleta:1.0.0 # {"$imagepolicy": "flux-system:ruleta"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # gunicorn escribe aquí
      volumes:
        - {name: tmp, emptyDir: {}}
