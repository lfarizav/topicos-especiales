apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: ruleta
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref: {branch: main}
    commit:
      author: {name: fluxcdbot, email: fluxcdbot@users.noreply.example.com}
      messageTemplate: |
        chore(ruleta): {{range .Changed.Changes}}{{.OldValue}} -> {{.NewValue}}{{end}}
    push:
      branch: main
  update:
    path: ./apps/ruleta
    strategy: Setters
